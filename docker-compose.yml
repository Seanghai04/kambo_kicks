services:
  db:
    image: postgres:16-alpine
    container_name: shai-kicks-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shai_kicks_dev
      POSTGRES_DB: shai_kicks
    volumes:
      - shai_kicks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shai_kicks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shai-kicks-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APP_NAME: KAMBO-KICKS
      APP_ENV: local
      APP_KEY: base64:egNqxF0ZeNjoarKrvV4UeQ623glM9DcD66iu9+5ifqU=
      APP_DEBUG: "true"
      APP_URL: http://localhost:5000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: shai_kicks
      DB_USERNAME: postgres
      DB_PASSWORD: shai_kicks_dev
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5000/api/auth/google/callback}
      GOOGLE_REDIRECT_URI_LOCAL: ${GOOGLE_REDIRECT_URI_LOCAL:-http://localhost:5000/api/auth/google/callback}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-kambo_kicks_dev_webhook_secret}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: shai-kicks-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

volumes:
  shai_kicks_pgdata:
